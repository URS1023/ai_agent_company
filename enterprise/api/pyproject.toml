[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "enterprise-platform-core"
version = "0.2.0"
description = "Additive enterprise business domain for Dify"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4,<5",
    "pydantic>=2.10,<3",
    "httpx>=0.28,<1",
    "sqlalchemy>=2.0,<3",
    "sqlglot>=28,<30",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "psycopg[binary]>=3.2,<4",
    "pymysql>=1.1,<2",
    "cryptography>=49,<50",
    "python-docx==1.2.0",
]

[dependency-groups]
dev = ["pytest>=9.0.3,<10", "ruff==0.15.12", "mypy>=1.20.2,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_platform"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = ["integration: requires explicit disposable database test execution"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
