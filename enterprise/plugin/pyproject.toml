[project]
name = "enterprise-device-assessment-plugin"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["dify-plugin==0.9.1", "httpx==0.28.1", "pydantic>=2.13.4,<3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["managed_device_plugin"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
