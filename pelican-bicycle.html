<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #0b1020;
    font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
  }

  .stage {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
  }

  svg#scene {
    width: 100%;
    height: 100%;
    display: block;
  }

  .hud {
    position: fixed;
    left: 24px;
    bottom: 20px;
    color: #9fb4d8;
    font-size: 13px;
    letter-spacing: .08em;
    text-transform: uppercase;
    pointer-events: none;
    user-select: none;
    text-shadow: 0 1px 6px rgba(0,0,0,.7);
  }
  .hud b { color: #ffd479; font-weight: 600; }

  /* ---------- 关键帧（SMIL 之外的 CSS 增强） ---------- */

  /* 车轮整体旋转：以轮心为原点 */
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 脚踏曲柄旋转 */
  @keyframes crank { to { transform: rotate(360deg); } }

  /* 身体上下颠簸（蹬踏节奏） */
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25%      { transform: translateY(-2.4px) rotate(-.9deg); }
    50%      { transform: translateY(0.8px) rotate(.5deg); }
    75%      { transform: translateY(-2.0px) rotate(-.6deg); }
  }

  /* 头部点动 —— 跟着蹬踏轻轻前倾后仰 */
  @keyframes headBob {
    0%, 100% { transform: rotate(-1.2deg); }
    50%      { transform: rotate(1.6deg); }
  }

  /* 翅膀（车把上的小手）上下扇动 */
  @keyframes flap {
    0%, 100% { transform: rotate(-4deg); }
    50%      { transform: rotate(7deg); }
  }

  /* 喙囊（喉袋）摇晃 */
  @keyframes pouchSwing {
    0%, 100% { transform: rotate(2.5deg) scaleY(1); }
    50%      { transform: rotate(-3.5deg) scaleY(1.06); }
  }

  /* 围巾飘动 */
  @keyframes scarf {
    0%, 100% { transform: translateX(0) skewY(0deg) scaleX(1); }
    50%      { transform: translateX(-4px) skewY(3deg) scaleX(1.08); }
  }

  /* 背景云漂移 */
  @keyframes cloudDrift { to { transform: translateX(-1600px); } }

  /* 远山视差 */
  @keyframes hills { to { transform: translateX(-800px); } }

  /* 芦苇/草丛后备滚动 */
  @keyframes reeds { to { transform: translateX(-900px); } }

  /* 路面虚线飞驰 */
  @keyframes roadDashes { to { transform: translateX(-240px); } }

  /* 尘土粒子 */
  @keyframes dust {
    0%   { opacity: 0;   transform: translate(0,0) scale(.4); }
    25%  { opacity: .55; }
    100% { opacity: 0;   transform: translate(-90px,-46px) scale(1.9); }
  }

  /* 速度线 */
  @keyframes speedLine {
    0%   { opacity: 0;   transform: translateX(60px) scaleX(.3); }
    30%  { opacity: .75; }
    100% { opacity: 0;   transform: translateX(-260px) scaleX(1.5); }
  }

  /* 太阳光晕呼吸 */
  @keyframes sunPulse {
    0%, 100% { opacity: .55; transform: scale(1); }
    50%      { opacity: .9;  transform: scale(1.08); }
  }

  /* 整体轻微漂浮 */
  @keyframes floatY {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }

  /* ------- 应用动画 ------- */
  #rig            { animation: floatY 1.6s ease-in-out infinite; transform-origin: 0 0; }
  #bodyBob        { animation: bob .8s ease-in-out infinite; transform-origin: 0 0; }
  #headGroup      { animation: headBob .8s ease-in-out infinite; transform-origin: 0 0; }
  #wingNear       { animation: flap .8s ease-in-out infinite; transform-origin: 0 0; }
  #wingFar        { animation: flap .8s ease-in-out infinite reverse; transform-origin: 0 0; }
  #pouch          { animation: pouchSwing .8s ease-in-out infinite; transform-origin: 0 0; }
  #scarf          { animation: scarf .9s ease-in-out infinite; transform-origin: 0 0; }
  #wheelFront     { animation: spin .55s linear infinite; transform-origin: 0 0; }
  #wheelRear      { animation: spin .55s linear infinite; transform-origin: 0 0; }
  #crank          { animation: crank .8s linear infinite; transform-origin: 0 0; }
  .cloud          { animation: cloudDrift linear infinite; }
  #hillsFar       { animation: hills 26s linear infinite; }
  #hillsNear      { animation: hills 14s linear infinite; }
  #reeds          { animation: reeds 6s linear infinite; }
  #roadDashes     { animation: roadDashes .45s linear infinite; }
  .dust           { animation: dust 1.1s linear infinite; }
  .speedline      { animation: speedLine .75s linear infinite; }
  #sunGlow        { animation: sunPulse 3.4s ease-in-out infinite; transform-origin: 0 0; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 6s !important; }
  }
</style>
</head>
<body>
<div class="stage">
<svg id="scene" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="一只戴头盔的鹈鹕骑着自行车在乡间公路上飞驰的二维动画">

  <defs>
    <!-- 天空 -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1b2a5e"/>
      <stop offset="35%"  stop-color="#4a5fa8"/>
      <stop offset="62%"  stop-color="#f08a5d"/>
      <stop offset="78%"  stop-color="#ffc36b"/>
      <stop offset="100%" stop-color="#ffe6a7"/>
    </linearGradient>

    <!-- 太阳 -->
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fffbe8" stop-opacity="1"/>
      <stop offset="45%"  stop-color="#ffd166" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>

    <!-- 远山 -->
    <linearGradient id="hillFarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b4b8a"/>
      <stop offset="100%" stop-color="#3a3060"/>
    </linearGradient>
    <linearGradient id="hillNearGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38507a"/>
      <stop offset="100%" stop-color="#22304f"/>
    </linearGradient>

    <!-- 路面 -->
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3b3f52"/>
      <stop offset="100%" stop-color="#1d2030"/>
    </linearGradient>

    <!-- 鹈鹕身体渐变 -->
    <linearGradient id="pelicanBody" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="55%"  stop-color="#f2f4f8"/>
      <stop offset="100%" stop-color="#cdd6e4"/>
    </linearGradient>

    <!-- 翅膀渐变 -->
    <linearGradient id="wingGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e6ecf6"/>
      <stop offset="100%" stop-color="#aab8cd"/>
    </linearGradient>

    <!-- 喙 -->
    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffcf6b"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#e8761d"/>
    </linearGradient>

    <!-- 车架金属 -->
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ff5f6d"/>
      <stop offset="50%"  stop-color="#e0243a"/>
      <stop offset="100%" stop-color="#a4102a"/>
    </linearGradient>

    <!-- 光晕滤镜 -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="blurSmall" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <filter id="blurBig" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <!-- 尘土粒子 -->
    <radialGradient id="dustGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#e9d9b8" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#e9d9b8" stop-opacity="0"/>
    </radialGradient>

    <!-- 辐条图案 -->
    <g id="spokes">
      <line x1="0" y1="-58" x2="0" y2="58" stroke="#dfe6f2" stroke-width="2" opacity=".85"/>
      <line x1="0" y1="-58" x2="0" y2="58" stroke="#dfe6f2" stroke-width="2" opacity=".85" transform="rotate(30)"/>
      <line x1="0" y1="-58" x2="0" y2="58" stroke="#dfe6f2" stroke-width="2" opacity=".85" transform="rotate(60)"/>
      <line x1="0" y1="-58" x2="0" y2="58" stroke="#dfe6f2" stroke-width="2" opacity=".85" transform="rotate(90)"/>
      <line x1="0" y1="-58" x2="0" y2="58" stroke="#dfe6f2" stroke-width="2" opacity=".85" transform="rotate(120)"/>
      <line x1="0" y1="-58" x2="0" y2="58" stroke="#dfe6f2" stroke-width="2" opacity=".85" transform="rotate(150)"/>
    </g>

    <g id="cloudShape">
      <ellipse cx="0"   cy="0"  rx="52" ry="26"/>
      <ellipse cx="44"  cy="8"  rx="38" ry="20"/>
      <ellipse cx="-44" cy="10" rx="34" ry="18"/>
      <ellipse cx="14"  cy="-16" rx="30" ry="20"/>
    </g>
  </defs>

  <!-- ================= 天空 ================= -->
  <rect x="0" y="0" width="1200" height="700" fill="url(#sky)"/>

  <!-- 星星（上半天） -->
  <g fill="#ffffff">
    <circle cx="120" cy="60"  r="1.8" opacity=".85"/>
    <circle cx="260" cy="34"  r="1.3" opacity=".6"/>
    <circle cx="420" cy="86"  r="1.6" opacity=".75"/>
    <circle cx="560" cy="42"  r="1.2" opacity=".55"/>
    <circle cx="700" cy="70"  r="1.7" opacity=".8"/>
    <circle cx="840" cy="30"  r="1.4" opacity=".6"/>
    <circle cx="980" cy="92"  r="1.5" opacity=".7"/>
    <circle cx="1100" cy="48" r="1.2" opacity=".5"/>
    <circle cx="180" cy="132" r="1.1" opacity=".45"/>
    <circle cx="640" cy="140" r="1.1" opacity=".4"/>
    <circle cx="900" cy="150" r="1.1" opacity=".4"/>
  </g>

  <!-- ================= 太阳 ================= -->
  <g>
    <circle id="sunGlow" cx="960" cy="250" r="150" fill="url(#sunGrad)"/>
    <circle cx="960" cy="250" r="62" fill="#fff3c9" opacity=".95" filter="url(#softGlow)"/>
    <circle cx="960" cy="250" r="48" fill="#fffdf2"/>
  </g>

  <!-- ================= 云 ================= -->
  <g id="clouds" fill="#ffe9d0">
    <g class="cloud" style="animation-duration: 58s; animation-delay: -6s;" opacity=".72" transform="translate(1180,180) scale(1.25)">
      <use href="#cloudShape"/>
    </g>
    <g class="cloud" style="animation-duration: 82s; animation-delay: -30s;" opacity=".55" transform="translate(1180,120) scale(.85)">
      <use href="#cloudShape"/>
    </g>
    <g class="cloud" style="animation-duration: 44s; animation-delay: -14s;" opacity=".62" transform="translate(1180,235) scale(1.05)">
      <use href="#cloudShape"/>
    </g>
    <g class="cloud" style="animation-duration: 70s; animation-delay: -48s;" opacity=".45" transform="translate(1180,300) scale(.7)">
      <use href="#cloudShape"/>
    </g>
  </g>

  <!-- ================= 飞行的小鸟 ================= -->
  <g fill="none" stroke="#2b2440" stroke-width="2.4" stroke-linecap="round" opacity=".55">
    <path d="M300 180 q10 -9 20 0 q10 -9 20 0">
      <animateTransform attributeName="transform" type="translate" values="0 0; -46 -14; -92 -4; -138 -20" dur="18s" repeatCount="indefinite"/>
    </path>
    <path d="M540 140 q8 -7 16 0 q8 -7 16 0">
      <animateTransform attributeName="transform" type="translate" values="0 0; -40 -18; -84 -8" dur="22s" repeatCount="indefinite"/>
    </path>
    <path d="M760 205 q7 -6 14 0 q7 -6 14 0">
      <animateTransform attributeName="transform" type="translate" values="0 0; -34 -10; -70 -24" dur="16s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ================= 远山（视差） ================= -->
  <g id="hillsFar" opacity=".85">
    <path fill="url(#hillFarGrad)"
          d="M0 470 L0 400 L90 336 L170 392 L250 320 L340 396 L430 330 L520 400 L610 340 L700 402 L790 336 L880 398 L970 348 L1060 404 L1150 352 L1240 402 L1240 470 Z
             M-800 470 L-800 400 L-710 336 L-630 392 L-550 320 L-460 396 L-370 330 L-280 400 L-190 340 L-100 402 L-10 336 L80 398 L170 348 L260 404 L350 352 L440 402 L440 470 Z"/>
  </g>

  <g id="hillsNear" opacity=".95">
    <path fill="url(#hillNearGrad)"
          d="M0 500 L0 436 L70 392 L150 442 L230 386 L320 448 L410 396 L500 450 L590 400 L680 452 L770 404 L860 456 L950 410 L1040 458 L1130 412 L1220 460 L1220 500 Z
             M-800 500 L-800 436 L-730 392 L-650 442 L-570 386 L-480 448 L-390 396 L-300 450 L-210 400 L-120 452 L-30 404 L60 456 L150 410 L240 458 L330 412 L420 460 L420 500 Z"/>
  </g>

  <!-- ================= 远景芦苇带 ================= -->
  <g id="reeds" opacity=".8">
    <g fill="#2a3a58">
      <rect x="0"    y="470" width="900" height="40"/>
      <rect x="900"  y="470" width="900" height="40"/>
    </g>
    <g stroke="#31506b" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M40 476 q6 -34 16 -50"/><path d="M70 476 q-4 -30 -12 -44"/>
      <path d="M120 476 q8 -40 20 -58"/><path d="M160 476 q-6 -32 -14 -46"/>
      <path d="M215 476 q7 -36 18 -52"/><path d="M258 476 q-5 -30 -12 -42"/>
      <path d="M320 476 q9 -42 22 -60"/><path d="M368 476 q-7 -34 -15 -48"/>
      <path d="M430 476 q6 -32 16 -48"/><path d="M478 476 q-4 -28 -11 -40"/>
      <path d="M540 476 q8 -38 19 -56"/><path d="M590 476 q-6 -32 -14 -46"/>
      <path d="M650 476 q7 -36 18 -52"/><path d="M700 476 q-5 -30 -12 -42"/>
      <path d="M760 476 q9 -42 22 -60"/><path d="M812 476 q-7 -34 -15 -48"/>
      <path d="M874 476 q6 -32 16 -48"/>
      <path d="M940 476 q6 -34 16 -50"/><path d="M970 476 q-4 -30 -12 -44"/>
      <path d="M1020 476 q8 -40 20 -58"/><path d="M1060 476 q-6 -32 -14 -46"/>
      <path d="M1115 476 q7 -36 18 -52"/><path d="M1158 476 q-5 -30 -12 -42"/>
      <path d="M1220 476 q9 -42 22 -60"/><path d="M1268 476 q-7 -34 -15 -48"/>
      <path d="M1330 476 q6 -32 16 -48"/><path d="M1378 476 q-4 -28 -11 -40"/>
      <path d="M1440 476 q8 -38 19 -56"/><path d="M1490 476 q-6 -32 -14 -46"/>
      <path d="M1550 476 q7 -36 18 -52"/><path d="M1600 476 q-5 -30 -12 -42"/>
      <path d="M1660 476 q9 -42 22 -60"/><path d="M1712 476 q-7 -34 -15 -48"/>
      <path d="M1774 476 q6 -32 16 -48"/>
    </g>
  </g>

  <!-- ================= 路面 ================= -->
  <rect x="0" y="510" width="1200" height="190" fill="url(#roadGrad)"/>
  <rect x="0" y="510" width="1200" height="6" fill="#4b5170" opacity=".8"/>

  <!-- 路面虚线 -->
  <g id="roadDashes" opacity=".65">
    <g fill="#f4f7ff">
      <rect x="0"    y="606" width="86" height="7" rx="3.5"/>
      <rect x="120"  y="606" width="86" height="7" rx="3.5"/>
      <rect x="240"  y="606" width="86" height="7" rx="3.5"/>
      <rect x="360"  y="606" width="86" height="7" rx="3.5"/>
      <rect x="480"  y="606" width="86" height="7" rx="3.5"/>
      <rect x="600"  y="606" width="86" height="7" rx="3.5"/>
      <rect x="720"  y="606" width="86" height="7" rx="3.5"/>
      <rect x="840"  y="606" width="86" height="7" rx="3.5"/>
      <rect x="960"  y="606" width="86" height="7" rx="3.5"/>
      <rect x="1080" y="606" width="86" height="7" rx="3.5"/>
      <rect x="1200" y="606" width="86" height="7" rx="3.5"/>
      <rect x="1320" y="606" width="86" height="7" rx="3.5"/>
      <rect x="1440" y="606" width="86" height="7" rx="3.5"/>
      <rect x="1560" y="606" width="86" height="7" rx="3.5"/>
      <rect x="1680" y="606" width="86" height="7" rx="3.5"/>
      <rect x="1800" y="606" width="86" height="7" rx="3.5"/>
    </g>
  </g>

  <!-- 路肩反光带 -->
  <rect x="0" y="560" width="1200" height="3" fill="#7d86a8" opacity=".18"/>

  <!-- ================= 速度线 ================= -->
  <g stroke="#ffffff" stroke-linecap="round" opacity=".5">
    <line class="speedline" style="animation-delay: 0s"    x1="880" y1="330" x2="980" y2="330" stroke-width="3"/>
    <line class="speedline" style="animation-delay: .18s"  x1="900" y1="372" x2="1030" y2="372" stroke-width="2.2"/>
    <line class="speedline" style="animation-delay: .36s"  x1="860" y1="410" x2="950" y2="410" stroke-width="2.8"/>
    <line class="speedline" style="animation-delay: .54s"  x1="920" y1="452" x2="1010" y2="452" stroke-width="2"/>
    <line class="speedline" style="animation-delay: .27s"  x1="890" y1="288" x2="965" y2="288" stroke-width="1.8"/>
    <line class="speedline" style="animation-delay: .63s"  x1="905" y1="492" x2="995" y2="492" stroke-width="2.4"/>
  </g>

  <!-- ================= 车轮后尘土 ================= -->
  <g filter="url(#blurSmall)">
    <circle class="dust" style="animation-delay: 0s"    cx="300" cy="546" r="16" fill="url(#dustGrad)"/>
    <circle class="dust" style="animation-delay: .22s"  cx="292" cy="556" r="13" fill="url(#dustGrad)"/>
    <circle class="dust" style="animation-delay: .44s"  cx="306" cy="538" r="19" fill="url(#dustGrad)"/>
    <circle class="dust" style="animation-delay: .66s"  cx="284" cy="548" r="11" fill="url(#dustGrad)"/>
    <circle class="dust" style="animation-delay: .88s"  cx="298" cy="560" r="15" fill="url(#dustGrad)"/>
  </g>

  <!-- ================= 地面阴影 ================= -->
  <ellipse cx="470" cy="590" rx="190" ry="18" fill="#05070f" opacity=".38" filter="url(#blurBig)"/>

  <!-- ============================================================
       主角色：鹈鹕 + 自行车
       坐标系：以「后轮触地点」附近的整车中心为局部原点
  ============================================================ -->
  <g id="rig" transform="translate(470,470)">
  <g id="bodyBob">

    <!-- ---------------- 自行车（后层：远侧曲柄腿） ---------------- -->
    <g id="bikeBack">
      <!-- 后轮（远侧） -->
      <g transform="translate(-150,105)">
        <g transform="translate(0,0)">
          <g id="wheelRearFar" style="transform-origin: 0 0;">
            <circle r="72" fill="none" stroke="#20263c" stroke-width="9"/>
            <circle r="66" fill="none" stroke="#2c3450" stroke-width="3"/>
            <g opacity=".6">
              <use href="#spokes" transform="scale(.96)"/>
            </g>
            <circle r="9" fill="#c9d2e3" stroke="#6f7b96" stroke-width="2"/>
          </g>
        </g>
      </g>
    </g>

    <!-- ---------------- 远侧踏臂 ---------------- -->
    <g transform="translate(-4,118)">
      <g id="legFarGroup">
        <g transform="rotate(0)">
          <path d="M-2 -6 q-26 10 -34 40 q-6 24 6 44" fill="none" stroke="#d9552f" stroke-width="15" stroke-linecap="round"/>
          <path d="M-30 78 l-4 12 q-2 8 6 8 l18 0 q8 0 6 -8 l-4 -12 z" fill="#e8642f"/>
        </g>
      </g>
    </g>

    <!-- ---------------- 车架 ---------------- -->
    <g id="frame">
      <!-- 主三角 -->
      <g stroke="url(#frameGrad)" stroke-width="13" stroke-linecap="round" fill="none">
        <!-- 下管：中轴 → 头管 -->
        <path d="M-4 118 L118 34"/>
        <!-- 座管 -->
        <path d="M-4 118 L-46 -2"/>
        <!-- 上管 -->
        <path d="M-46 -2 L112 10"/>
        <!-- 后上叉 -->
        <path d="M-46 -2 L-150 105"/>
        <!-- 后下叉 -->
        <path d="M-4 118 L-150 105"/>
        <!-- 头管 -->
        <path d="M112 10 L124 48"/>
      </g>

      <!-- 高光 -->
      <g stroke="#ff9aa5" stroke-width="3.4" stroke-linecap="round" fill="none" opacity=".75">
        <path d="M0 108 L116 28"/>
        <path d="M-44 -6 L106 4"/>
        <path d="M-42 -4 L-146 99"/>
      </g>

      <!-- 前叉 -->
      <path d="M124 48 L150 105" stroke="#2b3350" stroke-width="9" stroke-linecap="round" fill="none"/>
      <path d="M126 52 L150 103" stroke="#5b6683" stroke-width="3" stroke-linecap="round" fill="none" opacity=".7"/>

      <!-- 座垫 -->
      <g transform="translate(-52,-16)">
        <path d="M-34 -2 q10 -10 34 -6 q16 3 22 8 q-14 8 -34 7 q-18 -1 -22 -9 z" fill="#1d2338"/>
        <path d="M-30 -4 q10 -7 30 -4" stroke="#4a5578" stroke-width="2.4" fill="none"/>
      </g>

      <!-- 座管杆 -->
      <path d="M-48 0 L-52 -14" stroke="#2b3350" stroke-width="7" stroke-linecap="round"/>

<div class="hud">🐦 <b>Pelican</b> · 2D SVG Animation</div>

<script>
  // 无依赖增强：给两个轮子一个随机初始角度，避免完全同步的“频闪感”
  (function () {
    const rear  = document.getElementById('wheelRear');
    const front = document.getElementById('wheelFront');
    if (!rear || !front) return;

    // 让后轮动画相位略微错开
    rear.style.animationDelay  = '-0.17s';
    front.style.animationDelay = '0s';

    // 页面隐藏时暂停动画，省电
    document.addEventListener('visibilitychange', () => {
      const state = document.hidden ? 'paused' : 'running';
      document.getAnimations().forEach(a => { a.playState !== 'idle' && (a[state === 'paused' ? 'pause' : 'play']()); });
    });

    // 点击/触摸让鹈鹕“加速”一小会儿
    let boostTimer = null;
    const rig = document.getElementById('rig');
    const crankEl = document.getElementById('crank');
    function boost() {
      if (!rig) return;
      rig.style.transition = 'transform .25s ease-out';
      rig.style.transform = 'translate(470px,462px) scale(1.03)';
      if (crankEl) crankEl.style.animationDuration = '0.42s';
      clearTimeout(boostTimer);
      boostTimer = setTimeout(() => {
        rig.style.transform = 'translate(470px,470px) scale(1)';
        if (crankEl) crankEl.style.animationDuration = '0.8s';
      }, 700);
    }
    window.addEventListener('pointerdown', boost);
  })();
</script>
