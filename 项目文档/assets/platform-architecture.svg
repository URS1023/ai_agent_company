<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6a80a0"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1600" height="1010" rx="0" fill="#f3f6fa" stroke="none"/><text x="60" y="58" font-size="32" fill="#152a47" font-weight="700">制造业 Agent 平台：完整复用与业务聚合</text><text x="60" y="94" font-size="20" fill="#5b6e87" font-weight="400">入口、身份、业务资源与结果统一；原生应用、数据库与执行语义保持清楚边界</text><rect x="60" y="130" width="1480" height="105" rx="12" fill="#edf4ff" stroke="#dbe4ee"/><rect x="60" y="130" width="6" height="105" rx="3" fill="#1668dc" stroke="none"/><text x="82" y="165" font-size="23" fill="#1668dc" font-weight="700">员工 · 设备工程师 · 质检人员 · 管理员</text><text x="82" y="198" font-size="18" fill="#233348" font-weight="400">同一企业身份；按组织、工厂、工作区和具体资源授权</text><path d="M800 237 L800 273" fill="none" stroke="#6a80a0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="60" y="275" width="1480" height="105" rx="12" fill="#ffffff" stroke="#dbe4ee"/><rect x="60" y="275" width="6" height="105" rx="3" fill="#1668dc" stroke="none"/><text x="82" y="310" font-size="23" fill="#1668dc" font-weight="700">qKnow 风格统一产品入口</text><text x="82" y="343" font-size="18" fill="#233348" font-weight="400">/home 工作台 · /ai 原生对话 · /studio 原生开发 · /data 分析 · /reports 报表 · 工业业务页面</text><path d="M230 382 L230 422" fill="none" stroke="#6a80a0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="60" y="425" width="340" height="170" rx="12" fill="#ffffff" stroke="#dbe4ee"/><rect x="60" y="425" width="6" height="170" rx="3" fill="#1668dc" stroke="none"/><text x="82" y="460" font-size="23" fill="#1668dc" font-weight="700">Open WebUI</text><text x="82" y="493" font-size="18" fill="#233348" font-weight="400">Svelte + FastAPI</text><text x="82" y="520" font-size="18" fill="#233348" font-weight="400">对话、工具循环、子 Agent</text><text x="82" y="547" font-size="18" fill="#233348" font-weight="400">附件、记忆、成果与个人任务</text><path d="M230 598 L230 647" fill="none" stroke="#6a80a0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M610 382 L610 422" fill="none" stroke="#6a80a0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="440" y="425" width="340" height="170" rx="12" fill="#ffffff" stroke="#dbe4ee"/><rect x="440" y="425" width="6" height="170" rx="3" fill="#1668dc" stroke="none"/><text x="462" y="460" font-size="23" fill="#1668dc" font-weight="700">Dify</text><text x="462" y="493" font-size="18" fill="#233348" font-weight="400">React/Next + Python</text><text x="462" y="520" font-size="18" fill="#233348" font-weight="400">Agent V2、知识、工作流节点</text><text x="462" y="547" font-size="18" fill="#233348" font-weight="400">调试、发布、触发与执行</text><path d="M610 598 L610 647" fill="none" stroke="#6a80a0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M990 382 L990 422" fill="none" stroke="#6a80a0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="820" y="425" width="340" height="170" rx="12" fill="#ffffff" stroke="#dbe4ee"/><rect x="820" y="425" width="6" height="170" rx="3" fill="#1668dc" stroke="none"/><text x="842" y="460" font-size="23" fill="#1668dc" font-weight="700">qKnow 特色领域</text><text x="842" y="493" font-size="18" fill="#233348" font-weight="400">Vue + 可复用领域服务</text><text x="842" y="520" font-size="18" fill="#233348" font-weight="400">本体、抽取、图谱与运营</text><text x="842" y="547" font-size="18" fill="#233348" font-weight="400">预留功能补齐真实接口</text><path d="M990 598 L990 647" fill="none" stroke="#6a80a0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1370 382 L1370 422" fill="none" stroke="#6a80a0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1200" y="425" width="340" height="170" rx="12" fill="#ffffff" stroke="#dbe4ee"/><rect x="1200" y="425" width="6" height="170" rx="3" fill="#1668dc" stroke="none"/><text x="1222" y="460" font-size="23" fill="#1668dc" font-weight="700">Test5 分析报表</text><text x="1222" y="493" font-size="18" fill="#233348" font-weight="400">Vue + Python 提取模块</text><text x="1222" y="520" font-size="18" fill="#233348" font-weight="400">受控查询、设计器与组件</text><text x="1222" y="547" font-size="18" fill="#233348" font-weight="400">20 模板、绑定、版本与导出</text><path d="M1370 598 L1370 647" fill="none" stroke="#6a80a0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="60" y="650" width="1480" height="135" rx="12" fill="#edf8f4" stroke="#dbe4ee"/><rect x="60" y="650" width="6" height="135" rx="3" fill="#16866f" stroke="none"/><text x="82" y="685" font-size="23" fill="#16866f" font-weight="700">平台业务服务、薄适配器与运行目录</text><text x="82" y="718" font-size="18" fill="#233348" font-weight="400">设备 / 产品 / 检测 / 异常处置 / 分析成果；资源 ID 与版本、输入输出、来源证据与执行身份</text><text x="82" y="745" font-size="18" fill="#233348" font-weight="400">权限二次校验 · Outbox 投递 · 幂等回执 · 状态对账 · 实际取消 · 不明终态不自动重放</text><path d="M230 788 L230 825" fill="none" stroke="#6a80a0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="60" y="828" width="340" height="105" rx="12" fill="#ffffff" stroke="#dbe4ee"/><rect x="60" y="828" width="6" height="105" rx="3" fill="#49607b" stroke="none"/><text x="82" y="863" font-size="23" fill="#49607b" font-weight="700">平台业务库</text><text x="82" y="896" font-size="18" fill="#233348" font-weight="400">设备、检测、处置、映射和审计</text><path d="M610 788 L610 825" fill="none" stroke="#6a80a0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="440" y="828" width="340" height="105" rx="12" fill="#ffffff" stroke="#dbe4ee"/><rect x="440" y="828" width="6" height="105" rx="3" fill="#49607b" stroke="none"/><text x="462" y="863" font-size="23" fill="#49607b" font-weight="700">原生应用各自存储</text><text x="462" y="896" font-size="18" fill="#233348" font-weight="400">会话、Dify 资源和运行、图谱</text><path d="M990 788 L990 825" fill="none" stroke="#6a80a0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="820" y="828" width="340" height="105" rx="12" fill="#ffffff" stroke="#dbe4ee"/><rect x="820" y="828" width="6" height="105" rx="3" fill="#49607b" stroke="none"/><text x="842" y="863" font-size="23" fill="#49607b" font-weight="700">客户业务数据</text><text x="842" y="896" font-size="18" fill="#233348" font-weight="400">受控查询；不由聊天直接写库</text><path d="M1370 788 L1370 825" fill="none" stroke="#6a80a0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1200" y="828" width="340" height="105" rx="12" fill="#ffffff" stroke="#dbe4ee"/><rect x="1200" y="828" width="6" height="105" rx="3" fill="#49607b" stroke="none"/><text x="1222" y="863" font-size="23" fill="#49607b" font-weight="700">文件与模型服务</text><text x="1222" y="896" font-size="18" fill="#233348" font-weight="400">资料成果、检索、视觉、代码执行</text><text x="60" y="977" font-size="19" fill="#60718a" font-weight="400">设计示意，尚未实施。部署、SSO、子路径、原生权限和资源容量必须在技术验证阶段实测。</text></g></svg>