<title>设备维护 · qKnow</title>
<style>

*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{font:14px/1.5 "Helvetica Neue","PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--text);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.6}button,a,input,select,textarea{outline:none}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:3px}button,input,select,textarea,.panel{border-radius:2px}button{border:1px solid #dcdfe6;background:white;color:var(--text);height:32px;padding:0 15px;transition:background-color .1s,color .1s}button:hover{border-color:#bdd1fd;background:#e9effe;color:var(--blue)}button.primary{background:var(--blue);border-color:var(--blue);color:#fff}button.primary:hover{background:#6793fc}.link{height:auto;padding:0;border:0;background:none;color:var(--blue)}.link:hover{background:none;text-decoration:underline}.shell{height:100vh;display:grid;grid-template-columns:210px minmax(0,1fr);overflow:hidden}.sidebar{background:var(--nav);color:#ffffffb3;display:flex;flex-direction:column;min-height:0}.brand{height:60px;display:flex;align-items:center;gap:9px;padding:0 24px;border-bottom:1px solid #ffffff12;flex:none;color:#fff}.brand-mark{font-size:29px;font-weight:900;color:#4e9eff;font-style:italic}.brand-word{font-size:26px;font-weight:600;letter-spacing:-1px}.side-menu{padding:20px 12px;min-height:0;overflow:auto;overscroll-behavior:contain;flex:1}.menu-caption{font-size:12px;color:#7a93aa;padding:0 15px 12px}.side-button{width:100%;border:0;border-radius:2px;color:#ffffffb3;background:none;text-align:left;display:flex;align-items:center;gap:12px;height:44px;margin-bottom:8px;padding:0 16px}.side-button:hover{background:#0c2135;color:white}.side-button.active{color:white;background:var(--blue)}.side-button svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6}.sidebar-foot{padding:18px 25px;color:#a3b5c5;border-top:1px solid #ffffff14;font-size:12px}.main-shell{min-width:0;min-height:0;display:grid;grid-template-rows:60px 34px minmax(0,1fr);overflow:hidden}.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 20px 0 15px;background:linear-gradient(110deg,#fff,#f3f7ff);box-shadow:0 1px 8px #142e5812;z-index:1;gap:16px}.top-nav{display:flex;gap:6px;min-width:0}.top-nav button{height:40px;border:0;background:transparent;font-size:15px;font-weight:600;padding:0 19px;border-radius:4px;white-space:nowrap}.top-nav button.active,.top-nav button:hover{background:var(--blue);color:white;box-shadow:0 2px 7px #2666fb23}.top-tools{display:flex;align-items:center;gap:14px}.top-tools select{width:145px;border:1px solid #dcdfe6;height:32px;background:#fff;padding:0 9px}.avatar{display:flex;width:30px;height:30px;align-items:center;justify-content:center;background:#e7efff;color:var(--blue);border-radius:50%;font-size:13px}.badge{display:inline-flex;align-items:center;padding:1px 7px;font-size:12px;background:#e9effe;color:#2666fb;border-radius:2px;white-space:nowrap}.worktabs{height:34px;background:white;border-bottom:1px solid #e6e9ee;padding:4px 15px}.worktab{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 10px;background:var(--blue);color:white;font-size:12px;border-radius:2px}.worktab:before{content:"";width:7px;height:7px;border-radius:50%;background:white}.content{padding:15px;overflow-y:auto;min-height:0;overscroll-behavior:contain;scrollbar-gutter:stable}.view[hidden]{display:none}.view{display:grid;gap:15px}.panel{background:white;padding:18px 20px}.filter-panel{padding:15px 20px;display:flex;align-items:center;gap:17px;flex-wrap:wrap}.filter-field{display:flex;align-items:center;gap:8px;white-space:nowrap}.filter-field select,.filter-field input{height:32px;border:1px solid #dcdfe6;background:white;padding:0 10px;color:#333;min-width:140px}.filter-field.object select{min-width:205px}.filter-panel .primary{margin-left:auto;min-width:100px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 19px;gap:15px}.section-head h1,.section-head h2{font-size:16px;line-height:24px;margin:0;font-weight:600}.section-head h2:before{content:"";display:inline-block;width:4px;height:16px;background:var(--blue);margin-right:9px;vertical-align:-2px;border-radius:2px}.section-head .text-muted{color:var(--muted);font-size:13px}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--line);padding:0 0 20px;margin-bottom:20px}.metric{padding:0 26px;border-left:1px solid var(--line)}.metric:first-child{padding-left:0;border:0}.metric-label{color:#666;margin-bottom:6px}.metric-value{font-size:30px;font-weight:600;letter-spacing:.3px;color:#252d3a;line-height:1.2}.metric-value em{font-size:15px;font-weight:400;font-style:normal;padding-left:4px;color:#666}.metric-value.warm{color:#d37816}.chart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.chart-title{font-size:14px;font-weight:600}.legend{display:flex;gap:20px;color:#666;font-size:12px}.legend span{display:flex;align-items:center;gap:7px}.legend i{width:19px;height:0;border-top:2px solid var(--blue)}.legend .dashed{border-color:#9ba7b9;border-top-style:dashed}.chart-container{width:100%;overflow:hidden}.chart-container svg{display:block;width:100%;height:280px}.chart-container text{font-family:inherit;font-size:12px;fill:#7c8798}.action-panel{display:flex;align-items:center;gap:18px;padding:20px;border-left:3px solid #f0b44e}.action-icon{display:flex;align-items:center;justify-content:center;width:38px;height:38px;background:#fff5e5;color:#b57617;border-radius:2px;flex:none;font-size:20px}.action-copy{flex:1;font-size:15px;font-weight:500}.action-panel .tag{margin-right:8px}.tag{display:inline-flex;align-items:center;background:#fff5df;color:#a86b08;font-size:12px;padding:2px 8px;border-radius:2px;white-space:nowrap;font-weight:400}.tag.green{color:#008c42;background:#eaf7ef}.tag.blue{color:#2666fb;background:#e9effe}.tag.red{color:#cf453f;background:#fff0ef}.table-wrap{overflow-x:auto;max-width:100%}table{width:100%;border-collapse:collapse;text-align:left;font-size:14px;white-space:nowrap}th{background:#f1f1f5;color:#666;font-weight:600;padding:10px 13px}td{padding:15px 13px;border-bottom:1px solid var(--line)}tbody tr:hover{background:#e9f0ff}td.device-name{font-weight:500}.table-panel{padding:18px 20px 22px}.table-panel .section-head{margin-bottom:16px}.table-footer{display:flex;justify-content:flex-end;padding-top:18px;color:#666;font-size:13px}.empty{padding:65px 15px;text-align:center;color:#7b8492}.record-note{white-space:normal;max-width:360px}.record-date{line-height:1.7}.backdrop{position:fixed;inset:0;background:#00152950;z-index:10;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}.backdrop.open{opacity:1;visibility:visible}.drawer{position:fixed;right:0;top:0;bottom:0;width:min(580px,60vw);background:white;z-index:11;display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden;transition:transform .3s ease,visibility .3s;box-shadow:-7px 0 28px #00152914}.drawer.open{transform:translateX(0);visibility:visible}.overlay-header{padding:17px 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);flex:none}.overlay-header h2{font-size:16px;margin:0;font-weight:600}.close{border:0;background:none;width:30px;height:30px;font-size:22px;color:#666;padding:0}.drawer-body{padding:22px;overflow:auto;overscroll-behavior:contain;min-height:0}.drawer-sub{margin:0 0 18px;font-size:14px;color:#666}.drawer td{padding:11px 8px}.drawer th{padding:9px 8px;font-size:13px}.modal{border:0;padding:0;border-radius:2px;width:510px;max-height:86vh;color:#333;box-shadow:0 14px 65px #00152940}.modal::backdrop{background:#00152950}.modal .overlay-header{background:#f8f8f8;padding:11px 20px}.form-body{padding:22px 32px 8px;overflow-y:auto;max-height:60vh}.field{display:grid;gap:7px;margin-bottom:17px}.field label{font-size:14px}.required{color:#dc4b45;padding-left:3px}.field input,.field select,.field textarea{border:1px solid #dcdfe6;padding:7px 10px;width:100%;background:white;min-height:34px}.field textarea{min-height:95px;resize:vertical}.field input[aria-invalid=true],.field textarea[aria-invalid=true]{border-color:#dc4b45}.field-error{color:#cf453f;font-size:12px;min-height:0}.field-error:empty{display:none}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.modal-footer{display:flex;justify-content:flex-end;gap:12px;padding:15px 20px 20px;border-top:1px solid var(--line)}.form-equipment{margin-bottom:20px;color:#333;font-weight:500}.toast{position:fixed;top:78px;left:calc(50% + 105px);transform:translate(-50%,-12px);background:#fff;box-shadow:0 4px 18px #00152922;border:1px solid #e3e9f2;color:#333;padding:11px 20px;z-index:30;border-radius:2px;opacity:0;visibility:hidden;transition:opacity .2s,transform .2s;display:flex;align-items:center;gap:9px}.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}.toast:before{content:"✓";color:#009e54}.record-link{margin-left:14px}.records-filter{display:flex;gap:14px;align-items:center}.records-filter select{height:32px;border:1px solid #dcdfe6;padding:0 10px;background:white}.drawer .empty{padding:35px 0}.status-label{font-size:12px;color:#666}.check-result{font-weight:500}.record-count{font-size:13px;color:#666;font-weight:400;margin-left:9px}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar" aria-label="设备维护导航">
  <div class="brand" aria-label="qKnow"><span class="brand-mark">K</span><span class="brand-word">qKnow</span></div>
  <nav class="side-menu"><div class="menu-caption">设备管理</div>
    <button class="side-button" data-view="ledger"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>设备台账</button>
    <button class="side-button active" data-view="analysis" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19h18M5 15l4-5 4 3 6-9M5 3v16"/></svg>维护分析</button>
    <button class="side-button" data-view="records"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h12v17H5V4h2M9 3h6v4H9zM9 12h6M9 16h6"/></svg>处理记录</button>
  </nav>
</aside>
<div class="main-shell">
  <header class="topbar"><nav class="top-nav" aria-label="工作入口"><button class="active" data-view="analysis">业务应用</button></nav><div class="top-tools"><span class="badge">示例</span><select id="workspace" aria-label="工作空间"><option value="东区工厂">东区工厂</option><option value="西区工厂">西区工厂</option></select><span class="avatar" aria-label="当前用户：张工">张</span></div></header>
  <div class="worktabs"><span class="worktab" id="worktab">维护分析</span></div>
  <main class="content" id="content">
    <section class="view" id="analysis-view" aria-label="维护分析">
      <div class="panel filter-panel"><label class="filter-field object">设备<select id="deviceSelect"></select></label><label class="filter-field">日期<select id="periodSelect"><option value="today">2026-10-20</option><option value="week">近7天</option><option value="month">近30天</option></select></label><label class="filter-field">工况<select id="conditionSelect"><option value="normal">额定负荷</option><option value="low">低负荷</option><option value="high">高负荷</option></select></label><button class="primary" id="reanalyze">重新分析</button></div>
      <div class="panel"><div class="section-head"><h1 id="analysisHeading">运行指标</h1><button class="link" id="openData">数据明细</button></div>
        <div class="metrics"><div class="metric"><div class="metric-label">当前温度</div><div class="metric-value" id="temperature">68.4<em>℃</em></div></div><div class="metric"><div class="metric-label">较同工况温度</div><div class="metric-value warm" id="difference">+9.6<em>℃</em></div></div><div class="metric"><div class="metric-label">振动速度</div><div class="metric-value" id="vibration">3.2<em>mm/s</em></div></div></div>
        <div class="chart-head"><span class="chart-title">温度趋势</span><div class="legend"><span><i></i>当前设备</span><span><i class="dashed"></i>同工况基线</span></div></div><div class="chart-container" id="chart"></div>
      </div>
      <div class="panel action-panel"><span class="action-icon" aria-hidden="true">!</span><div class="action-copy" id="checkAction">检查冷却器散热片积灰及冷却风扇运行。</div><span class="tag" id="checkStatus">待检查</span><button class="primary" id="recordCheck">记录检查</button></div>
    </section>
    <section class="view" id="ledger-view" aria-label="设备台账" hidden>
      <div class="panel filter-panel"><label class="filter-field">设备<input id="deviceSearch" type="search" placeholder="名称或编号"></label><label class="filter-field">状态<select id="statusFilter"><option value="all">全部</option><option value="待检查">待检查</option><option value="正常">正常</option><option value="待维修">待维修</option><option value="观察中">观察中</option></select></label></div>
      <div class="panel table-panel"><div class="section-head"><h1>设备台账</h1></div><div class="table-wrap"><table><thead><tr><th>设备名称</th><th>设备编号</th><th>位置</th><th>温度</th><th>振动速度</th><th>状态</th><th>操作</th></tr></thead><tbody id="ledgerBody"></tbody></table></div><div class="table-footer" id="ledgerCount"></div></div>
    </section>
    <section class="view" id="records-view" aria-label="处理记录" hidden><div class="panel table-panel"><div class="section-head"><h1>处理记录<span class="record-count" id="recordCount"></span></h1><label class="records-filter">设备<select id="recordDeviceFilter" aria-label="筛选处理记录设备"><option value="all">全部设备</option></select></label></div><div class="table-wrap"><table><thead><tr><th>检查时间</th><th>设备</th><th>检查人</th><th>处理结果</th><th>检查记录</th></tr></thead><tbody id="recordsBody"></tbody></table></div></div></section>
  </main>
</div>
</div>
<div class="backdrop" id="drawerBackdrop"></div>
<aside class="drawer" id="dataDrawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-hidden="true" inert><div class="overlay-header"><h2 id="drawerTitle">数据明细</h2><button class="close" id="closeDrawer" aria-label="关闭数据明细">×</button></div><div class="drawer-body"><p class="drawer-sub" id="dataCaption"></p><table><thead><tr><th>时间</th><th>温度 / ℃</th><th>基线 / ℃</th><th>振动 / mm/s</th></tr></thead><tbody id="dataBody"></tbody></table></div></aside>
<dialog class="modal" id="checkModal" aria-labelledby="checkModalTitle"><div class="overlay-header"><h2 id="checkModalTitle">记录检查</h2><button type="button" class="close" id="closeModal" aria-label="关闭记录检查">×</button></div><form id="checkForm" novalidate><div class="form-body"><div class="form-equipment" id="checkDevice"></div><div class="form-grid"><div class="field"><label for="inspector">检查人<span class="required">*</span></label><input id="inspector" autocomplete="name" maxlength="20" aria-describedby="inspectorError"><div class="field-error" id="inspectorError" role="alert"></div></div><div class="field"><label for="checkDate">检查日期<span class="required">*</span></label><input id="checkDate" type="date" value="2026-10-20" aria-describedby="dateError"><div class="field-error" id="dateError" role="alert"></div></div></div><div class="field"><label for="checkResult">处理结果<span class="required">*</span></label><select id="checkResult"><option value="观察中">继续观察</option><option value="正常">已恢复正常</option><option value="待维修">需要维修</option></select></div><div class="field"><label for="checkNote">检查记录<span class="required">*</span></label><textarea id="checkNote" placeholder="填写检查发现和已采取的处理措施" maxlength="300" aria-describedby="noteError"></textarea><div class="field-error" id="noteError" role="alert"></div></div></div><div class="modal-footer"><button type="button" id="cancelModal">取消</button><button type="submit" class="primary">保存记录</button></div></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
// 示例只操作浏览器本地状态，不请求接口、数据库或远程资源。
const devices=[
 {id:'AC-001',name:'1号空压机',location:'动力车间 · A区',workspace:'东区工厂',temp:68.4,base:58.8,vibration:3.2,status:'待检查',action:'检查冷却器散热片积灰及冷却风扇运行。'},
 {id:'AC-002',name:'2号空压机',location:'动力车间 · A区',workspace:'东区工厂',temp:59.1,base:58.8,vibration:1.8,status:'正常',action:'核对冷却风扇运行与润滑油液位。'},
 {id:'PU-003',name:'循环水泵',location:'公用工程 · B区',workspace:'东区工厂',temp:56.8,base:52.1,vibration:2.9,status:'待检查',action:'检查泵体连接紧固情况及轴承润滑状态。'},
 {id:'FN-004',name:'排风机',location:'生产车间 · C区',workspace:'东区工厂',temp:47.6,base:46.9,vibration:1.4,status:'正常',action:'检查进风口滤网及风机皮带张紧状态。'},
 {id:'AC-005',name:'3号空压机',location:'动力车间 · A区',workspace:'西区工厂',temp:65.2,base:57.6,vibration:2.7,status:'待检查',action:'检查冷却器通风及润滑油冷却回路。'},
 {id:'PU-006',name:'补水泵',location:'公用工程 · B区',workspace:'西区工厂',temp:51.3,base:50.2,vibration:1.6,status:'正常',action:'检查泵出口压力与轴承润滑状态。'}
];
const $=id=>document.getElementById(id),escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let records=[];
try{const saved=JSON.parse(localStorage.getItem('qknow-maintenance-demo-v1')||'[]');if(Array.isArray(saved))records=saved.filter(r=>r&&devices.some(d=>d.id===r.deviceId)&&typeof r.note==='string'&&typeof r.inspector==='string'&&['正常','观察中','待维修'].includes(r.result));}catch{}
let activeView='analysis',selectedId='AC-001',analysisRevision=0,series=[],toastTimer,drawerOpener,modalOpener,formDeviceId;
const viewTitles={analysis:'维护分析',ledger:'设备台账',records:'处理记录'};
function currentDevice(){return devices.find(d=>d.id===selectedId)}
function workspaceDevices(){return devices.filter(d=>d.workspace===$('workspace').value)}
function deviceStatus(d){return records.find(r=>r.deviceId===d.id)?.result||d.status}
function statusClass(status){return status==='正常'?'green':status==='待维修'?'red':status==='观察中'?'blue':''}
function showToast(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').classList.add('show');toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2400)}
function setView(view){activeView=view;document.querySelectorAll('.view').forEach(el=>el.hidden=el.id!==view+'-view');document.querySelectorAll('.side-button[data-view]').forEach(el=>{el.classList.toggle('active',el.dataset.view===view);if(el.dataset.view===view)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current')});$('worktab').textContent=viewTitles[view];$('content').scrollTop=0;if(view==='ledger')renderLedger();if(view==='records')renderRecords()}
document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>setView(button.dataset.view)));
function syncDeviceOptions(){const list=workspaceDevices();if(!list.some(d=>d.id===selectedId))selectedId=list[0].id;$('deviceSelect').innerHTML=list.map(d=>`<option value="${d.id}">${d.name} · ${d.id}</option>`).join('');$('deviceSelect').value=selectedId;$('recordDeviceFilter').innerHTML='<option value="all">全部设备</option>'+list.map(d=>`<option value="${d.id}">${d.name}</option>`).join('')}
// 趋势与数值使用固定样本；重分析仅小幅变更当前示例，方便检查状态反馈。
function renderAnalysis(){const d=currentDevice(),offset=$('conditionSelect').value==='high'?3.4:$('conditionSelect').value==='low'?-4.2:0,delta=analysisRevision%2?.3:0,temp=d.temp+offset+delta,base=d.base+offset;const period=$('periodSelect').value;
 $('analysisHeading').textContent='运行指标';$('temperature').innerHTML=temp.toFixed(1)+'<em>℃</em>';$('difference').innerHTML=(temp-base>=0?'+':'')+(temp-base).toFixed(1)+'<em>℃</em>';$('vibration').innerHTML=d.vibration.toFixed(1)+'<em>mm/s</em>';$('checkAction').textContent=d.action;const status=deviceStatus(d);$('checkStatus').textContent=status;$('checkStatus').className='tag '+statusClass(status);$('recordCheck').textContent=records.some(r=>r.deviceId===d.id)?'补充检查':'记录检查';
 const shape=[-4.4,-3.8,-4,-3.1,-3.2,-2.6,-2.9,-2.1,-1.4,-1.6,-.8,-.2,-.5,0];series=shape.map((n,i)=>({label:period==='today'?`${String(i+5).padStart(2,'0')}:00`:period==='week'?`10-${String(14+Math.floor(i/2)).padStart(2,'0')}`:`${String(9+Math.floor((21+i*2)/30)).padStart(2,'0')}-${String((21+i*2)%30+1).padStart(2,'0')}`,temp:temp+n,base:base+Math.sin(i*.5)*.35,vibration:d.vibration+(i%3-1)*.1}));renderChart();}
function renderChart(){const values=series.flatMap(p=>[p.temp,p.base]),min=Math.floor((Math.min(...values)-3)/5)*5,max=Math.ceil((Math.max(...values)+3)/5)*5,W=1040,H=280,left=48,right=20,top=20,bottom=35,x=i=>left+i*(W-left-right)/(series.length-1),y=n=>top+(max-n)*(H-top-bottom)/(max-min);const points=series.map((p,i)=>`${x(i)},${y(p.temp)}`).join(' '),baseline=series.map((p,i)=>`${x(i)},${y(p.base)}`).join(' ');let grid='';for(let i=0;i<5;i++){const val=min+(max-min)*i/4,yy=y(val);grid+=`<line x1="${left}" y1="${yy}" x2="${W-right}" y2="${yy}" stroke="#e9edf4"/><text x="${left-11}" y="${yy+4}" text-anchor="end">${val.toFixed(0)}</text>`}const labels=[0,3,6,9,13].map(i=>`<text x="${x(i)}" y="${H-9}" text-anchor="middle">${series[i].label}</text>`).join('');$('chart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${escapeHtml(currentDevice().name)}温度趋势，实线为当前温度，虚线为同工况基线"><defs><linearGradient id="trendFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2666fb" stop-opacity=".13"/><stop offset="1" stop-color="#2666fb" stop-opacity=".01"/></linearGradient></defs>${grid}<text x="10" y="16">℃</text><polygon points="${left},${H-bottom} ${points} ${W-right},${H-bottom}" fill="url(#trendFill)"/><polyline points="${baseline}" fill="none" stroke="#9ba7b9" stroke-width="1.8" stroke-dasharray="6 5"/><polyline points="${points}" fill="none" stroke="#2666fb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${x(13)}" cy="${y(series[13].temp)}" r="4" fill="white" stroke="#2666fb" stroke-width="2"/>${labels}</svg>`}
function renderLedger(){const keyword=$('deviceSearch').value.trim().toLowerCase(),status=$('statusFilter').value,list=workspaceDevices().filter(d=>(d.name+d.id).toLowerCase().includes(keyword)&&(status==='all'||deviceStatus(d)===status));$('ledgerBody').innerHTML=list.length?list.map(d=>`<tr><td class="device-name">${d.name}</td><td>${d.id}</td><td>${d.location}</td><td>${d.temp.toFixed(1)} ℃</td><td>${d.vibration.toFixed(1)} mm/s</td><td><span class="tag ${statusClass(deviceStatus(d))}">${deviceStatus(d)}</span></td><td><button class="link" data-analyze="${d.id}">查看分析</button></td></tr>`).join(''):'<tr><td colspan="7" class="empty">没有符合条件的设备</td></tr>';$('ledgerCount').textContent=`共 ${list.length} 台设备`;document.querySelectorAll('[data-analyze]').forEach(b=>b.addEventListener('click',()=>{selectedId=b.dataset.analyze;$('deviceSelect').value=selectedId;analysisRevision=0;renderAnalysis();setView('analysis')}))}
function renderRecords(){const ids=new Set(workspaceDevices().map(d=>d.id)),filter=$('recordDeviceFilter').value,list=records.filter(r=>ids.has(r.deviceId)&&(filter==='all'||r.deviceId===filter));$('recordCount').textContent=`${list.length} 条`;$('recordsBody').innerHTML=list.length?list.map(r=>`<tr><td class="record-date">${escapeHtml(r.date)}</td><td>${escapeHtml(devices.find(d=>d.id===r.deviceId).name)}</td><td>${escapeHtml(r.inspector)}</td><td><span class="tag ${statusClass(r.result)}">${r.result}</span></td><td class="record-note">${escapeHtml(r.note)}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">暂无检查记录</td></tr>'}
$('workspace').addEventListener('change',()=>{syncDeviceOptions();analysisRevision=0;renderAnalysis();renderLedger();renderRecords()});$('deviceSelect').addEventListener('change',()=>{selectedId=$('deviceSelect').value;analysisRevision=0;renderAnalysis()});['periodSelect','conditionSelect'].forEach(id=>$(id).addEventListener('change',renderAnalysis));$('deviceSearch').addEventListener('input',renderLedger);$('statusFilter').addEventListener('change',renderLedger);$('recordDeviceFilter').addEventListener('change',renderRecords);
$('reanalyze').addEventListener('click',()=>{const button=$('reanalyze');button.disabled=true;button.textContent='分析中…';setTimeout(()=>{analysisRevision++;renderAnalysis();button.disabled=false;button.textContent='重新分析';showToast('分析已更新')},600)});
function openDrawer(){drawerOpener=document.activeElement;$('dataCaption').textContent=currentDevice().name+' · '+$('periodSelect').selectedOptions[0].text+' · '+$('conditionSelect').selectedOptions[0].text;$('dataBody').innerHTML=series.map(p=>`<tr><td>${p.label}</td><td>${p.temp.toFixed(1)}</td><td>${p.base.toFixed(1)}</td><td>${p.vibration.toFixed(1)}</td></tr>`).join('');$('dataDrawer').inert=false;$('dataDrawer').setAttribute('aria-hidden','false');$('dataDrawer').classList.add('open');$('drawerBackdrop').classList.add('open');document.querySelector('.shell').inert=true;$('closeDrawer').focus()}
function closeDrawer(){$('dataDrawer').classList.remove('open');$('drawerBackdrop').classList.remove('open');$('dataDrawer').setAttribute('aria-hidden','true');$('dataDrawer').inert=true;document.querySelector('.shell').inert=false;drawerOpener?.focus()}
$('openData').addEventListener('click',openDrawer);$('closeDrawer').addEventListener('click',closeDrawer);$('drawerBackdrop').addEventListener('click',closeDrawer);
function clearErrors(){['inspector','checkDate','checkNote'].forEach(id=>$(id).removeAttribute('aria-invalid'));['inspectorError','dateError','noteError'].forEach(id=>$(id).textContent='')}
function openModal(){modalOpener=document.activeElement;formDeviceId=selectedId;$('checkForm').reset();clearErrors();$('checkDevice').textContent=currentDevice().name+' · '+currentDevice().id;$('inspector').value='张工';$('checkDate').value='2026-10-20';$('checkModal').showModal();$('inspector').focus()}
function closeModal(){$('checkModal').close();modalOpener?.focus()}
$('recordCheck').addEventListener('click',openModal);$('closeModal').addEventListener('click',closeModal);$('cancelModal').addEventListener('click',closeModal);$('checkModal').addEventListener('click',e=>{if(e.target===$('checkModal')){const box=$('checkModal').getBoundingClientRect();if(e.clientX<box.left||e.clientX>box.right||e.clientY<box.top||e.clientY>box.bottom)closeModal()}});$('checkModal').addEventListener('cancel',e=>{e.preventDefault();closeModal()});
// 保存前执行字段级校验，保留原始检查文字，不使用输入内容拼接未转义HTML。
$('checkForm').addEventListener('submit',e=>{e.preventDefault();clearErrors();const inspector=$('inspector').value.trim(),date=$('checkDate').value,note=$('checkNote').value.trim();let firstInvalid;function invalid(id,errorId,message){$(id).setAttribute('aria-invalid','true');$(errorId).textContent=message;firstInvalid??=$(id)}if(!inspector)invalid('inspector','inspectorError','请填写检查人');if(!date||!/^\d{4}-\d{2}-\d{2}$/.test(date))invalid('checkDate','dateError','请选择有效检查日期');if(note.length<5)invalid('checkNote','noteError','请至少填写5个字，说明检查发现或处理措施');if(firstInvalid){firstInvalid.focus();return}records.unshift({id:'check-'+Date.now(),deviceId:formDeviceId,inspector,date,result:$('checkResult').value,note});let stored=true;try{localStorage.setItem('qknow-maintenance-demo-v1',JSON.stringify(records))}catch{stored=false}closeModal();renderAnalysis();renderRecords();renderLedger();showToast(stored?'检查记录已保存':'已保存到当前页面，浏览器未允许持久保存')});
// 抽屉开启时限制键盘焦点在内部；原生dialog负责表单模态的焦点边界。
document.addEventListener('keydown',e=>{if(!$('dataDrawer').classList.contains('open'))return;if(e.key==='Escape'){e.preventDefault();closeDrawer()}if(e.key==='Tab'){const nodes=[...$('dataDrawer').querySelectorAll('button,a[href],input,select,textarea,[tabindex="0"]')].filter(n=>!n.disabled);if(!nodes.length)return;const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
syncDeviceOptions();renderAnalysis();renderLedger();renderRecords();
</script>
